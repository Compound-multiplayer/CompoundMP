name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '1'  # nothing here needs ICU, so runners without libicu work too
  BEPINEX_VERSION: 5.4.23.3
  BEPINEX_SHA256: 41a089e5b1b1f0713b331346baf6677b1184c69eabebf51101097954e854c749

jobs:
  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit subjects
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|docs|test|chore|refactor|perf|ci|build|style|revert)(\([a-z0-9._/-]+\))?!?: .+'
          bad=0
          while IFS= read -r subject; do
            if ! [[ "$subject" =~ $pattern ]]; then
              echo "::error::Not a conventional commit: $subject"
              bad=1
            fi
          done < <(git log --no-merges --format=%s "$BASE..$HEAD")
          exit $bad

  test:
    name: Protocol and UPnP tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # Loopback UDP transport, reliable delivery and UPnP against a fake router. No game files needed.
      - name: Run tests
        run: dotnet run --project tests -c Release

  compile:
    name: Compile plugin against reference stubs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # BepInEx and the Unity reference assemblies are public downloads (checksummed); ci/stubs stands in for the game's
      # Assembly-CSharp. This proves every push (and fork PR) still compiles without any game files.
      - name: Build against stubs
        run: ./ci/build-with-stubs.sh
      - name: Package
        run: |
          mkdir -p dist
          cp ci/.out/CompoundMP.dll README.md dist/
      - uses: actions/upload-artifact@v7
        with:
          name: CompoundMP
          path: dist/
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: compile
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CompoundMP
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd dist && zip -q "../CompoundMP-${TAG}.zip" CompoundMP.dll README.md)
          gh release create "$TAG" "CompoundMP-${TAG}.zip" --generate-notes --verify-tag
